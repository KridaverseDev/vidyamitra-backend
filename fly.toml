# fly.toml app configuration file generated for vidyamitra-backend
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "vidyamitra-backend"
primary_region = "bom"  # Mumbai (closest to India)

[build]

[env]
  APP_MODE = "prod"
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[deploy]
  strategy = "immediate"
  release_command = "poetry run python silicon/_microservices/admin/manage.py migrate --noinput"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
